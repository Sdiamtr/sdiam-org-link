<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SDIAM Links</title>
  <meta name="description" content="Siber Diplomasi ve İstihbarat Araştırmaları Merkezi official links">
  <meta name="theme-color" content="#020b32">

  <style>
    :root{
      --bg:#24223f;
      --card:#020b32;
      --text:#fff;
      --muted:#cfd4e8;
      --button:#f4f6fb;
      --button-text:#040b2f;
      --button-hover:#ffffff;
      --ring:#9db5ff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body{
      display:flex;
      justify-content:center;
      padding:20px 12px;
    }

    main{
      width:100%;
      max-width:580px;
      min-height:calc(100vh - 40px);
      background:var(--card);
      border-radius:22px;
      padding:28px 28px 26px;
      display:flex;
      flex-direction:column;
      align-items:center;
      box-shadow:0 18px 45px rgba(0,0,0,.22);
    }

    .top{
      width:100%;
      display:flex;
      justify-content:flex-end;
      margin-bottom:32px;
    }

    .lang{
      border:1px solid rgba(255,255,255,.35);
      border-radius:999px;
      padding:4px;
      display:flex;
      gap:4px;
      background:rgba(255,255,255,.08);
    }

    .lang button{
      border:0;
      border-radius:999px;
      padding:7px 11px;
      color:#fff;
      background:transparent;
      font-weight:800;
      font-size:12px;
      cursor:pointer;
    }

    .lang button.active{
      background:#fff;
      color:#040b2f;
    }

    .lang button:focus-visible,
    .social:focus-visible,
    .link:focus-visible{
      outline:3px solid var(--ring);
      outline-offset:3px;
    }

    .logo{
      width:96px;
      height:96px;
      border-radius:50%;
      background:#fff;
      object-fit:contain;
      padding:8px;
      margin-bottom:14px;
    }

    h1{
      max-width:450px;
      margin:0 0 10px;
      text-align:center;
      font-size:25px;
      line-height:1.18;
      letter-spacing:-.03em;
      font-weight:850;
    }

    .bio{
      max-width:430px;
      margin:0;
      color:var(--text);
      text-align:center;
      font-size:16px;
      line-height:1.45;
      font-weight:650;
    }

    .socials{
      display:flex;
      gap:24px;
      margin:26px 0 38px;
    }

    .social{
      color:#fff;
      text-decoration:none;
      display:grid;
      place-items:center;
      width:30px;
      height:30px;
    }

    .social svg{
      width:30px;
      height:30px;
      fill:currentColor;
    }

    .links{
      width:100%;
      display:grid;
      gap:14px;
    }

    .link{
      min-height:64px;
      border-radius:8px;
      background:var(--button);
      color:var(--button-text);
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 42px;
      text-align:center;
      font-size:16px;
      font-weight:750;
      line-height:1.25;
      position:relative;
      box-shadow:0 1px 0 rgba(255,255,255,.25) inset;
      transition:transform .12s ease,background .12s ease;
    }

    .link:hover{
      background:var(--button-hover);
      transform:translateY(-1px);
    }

    .link:active{transform:translateY(0)}

    .dots{
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      color:#68708b;
      font-weight:800;
      letter-spacing:2px;
    }

    footer{
      margin-top:auto;
      padding-top:40px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    footer a{
      color:var(--text);
      text-decoration:none;
    }

    footer a:hover{text-decoration:underline}

    @media (max-width:420px){
      body{
        padding:0;
        background:var(--card);
      }

      main{
        min-height:100vh;
        border-radius:0;
        box-shadow:none;
        padding:22px 18px;
      }

      .top{margin-bottom:26px}

      .logo{
        width:88px;
        height:88px;
      }

      h1{
        font-size:22px;
        max-width:340px;
      }

      .bio{
        font-size:15px;
        max-width:330px;
      }

      .link{
        min-height:62px;
        font-size:15px;
        padding-inline:34px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .link{transition:none}
    }
  </style>
</head>

<body>
  <main>
    <div class="top">
      <div class="lang" aria-label="Language selector">
        <button id="enBtn" class="active" type="button" onclick="setLang('en')">EN</button>
        <button id="trBtn" type="button" onclick="setLang('tr')">TR</button>
      </div>
    </div>

    <img class="logo" src="logo.webp" alt="SDIAM logo">

    <h1 data-en="Cyber Diplomacy and Intelligence Research Center" data-tr="Siber Diplomasi ve İstihbarat Araştırmaları Merkezi">
      Cyber Diplomacy and Intelligence Research Center
    </h1>

    <p class="bio"
       data-en="An independent research center focused on digital geopolitics, cybersecurity technologies, and strategic intelligence."
       data-tr="Dijital jeopolitik, siber güvenlik teknolojileri ve stratejik istihbarat alanlarında çalışan bağımsız araştırma merkezi.">
      An independent research center focused on digital geopolitics, cybersecurity technologies, and strategic intelligence.
    </p>

    <nav class="socials" aria-label="Social media">
      <a class="social" href="https://instagram.com/sdiamtr" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 12 16.5 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 12 14.5 2.5 2.5 0 0 0 12 9.5Zm5.2-2.7a1 1 0 1 1-1 1 1 1 0 0 1 1-1Z"/>
        </svg>
      </a>

      <a class="social" href="https://x.com/sdiam_tr" aria-label="X">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L6.3 22H3.2l7.3-8.4L2.8 2h6.4l4.4 6.7L18.9 2Zm-1.1 17.9h1.7L8.2 4H6.4l11.4 15.9Z"/>
        </svg>
      </a>

      <a class="social" href="https://tr.linkedin.com/in/siber-diplomasi-ve-istihbarat-ara%C5%9Ft%C4%B1rmalar%C4%B1-merkezi-000503376" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5ZM3 10h4v12H3V10Zm7 0h3.8v1.7h.1a4.2 4.2 0 0 1 3.8-2.1c4 0 4.8 2.6 4.8 6V22h-4v-5.7c0-1.4 0-3.1-1.9-3.1s-2.2 1.5-2.2 3V22h-4V10Z"/>
        </svg>
      </a>
    </nav>

    <section class="links" aria-label="Links">
      <a class="link" href="https://instagram.com/sdiamtr"
         data-en="Follow us on Instagram"
         data-tr="Bizi Instagram Hesabımızda Takip Et!">
        Follow us on Instagram
        <span class="dots" aria-hidden="true">⋮</span>
      </a>

      <a class="link" href="https://www.divandernegi.com.tr/bulten/siber-diplomasi-ve-istihbarat-arastirmalari-merkezi/"
         data-en="Read Our Analyses and Reports"
         data-tr="Analiz ve Raporlarımızı Web Sitemizde Oku!">
        Read Our Analyses and Reports
        <span class="dots" aria-hidden="true">⋮</span>
      </a>

      <a class="link" href="https://x.com/sdiam_tr"
         data-en="Follow us on X"
         data-tr="Bizi X Hesabımızda Takip Et!">
        Follow us on X
        <span class="dots" aria-hidden="true">⋮</span>
      </a>

      <a class="link" href="https://tr.linkedin.com/in/siber-diplomasi-ve-istihbarat-ara%C5%9Ft%C4%B1rmalar%C4%B1-merkezi-000503376"
         data-en="Follow us on LinkedIn"
         data-tr="Bizi LinkedIn Hesabımızda Takip Et!">
        Follow us on LinkedIn
        <span class="dots" aria-hidden="true">⋮</span>
      </a>
    </section>

    <footer>
      <a href="https://sdiam.org">sdiam.org</a>
      <span> · </span>
      <a href="mailto:info@sdiam.org" data-en="Contact" data-tr="İletişim">Contact</a>
    </footer>
  </main>

  <script>
    function setLang(lang){
      document.documentElement.lang=lang;
      document.querySelectorAll("[data-en]").forEach(function(el){
        var dots=el.querySelector(".dots");
        el.textContent=el.dataset[lang];
        if(dots) el.appendChild(dots);
      });
      document.getElementById("enBtn").classList.toggle("active",lang==="en");
      document.getElementById("trBtn").classList.toggle("active",lang==="tr");
    }
  </script>
</body>
</html>
